name: Scheduled jobs

# The API runs on Vercel, where nothing stays running between requests, so in-process
# timers (node-cron) never fire. This workflow is the timer: it calls the API's
# secret-protected job routes. Free for public repositories.
#
# Setup (Settings → Secrets and variables → Actions):
#   Variables → API_BASE_URL = https://<your-api>.vercel.app   (no trailing slash)
#   Secrets   → CRON_SECRET  = same value as CRON_SECRET in the API's Vercel project
# Until API_BASE_URL exists, the job is skipped.

on:
  schedule:
    # GitHub may start scheduled runs a few minutes late; every job is safe to run twice
    - cron: '*/10 * * * *'
    - cron: '15 3 * * *' # daily: reconcile-stripe, cleanup, roll-free-periods, verify-usage-counters, mrr-snapshot, reset-demo
  workflow_dispatch:

concurrency:
  group: scheduled-jobs
  cancel-in-progress: false

jobs:
  frequent:
    name: emails, webhooks, usage
    if: ${{ vars.API_BASE_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run send-emails
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 120 --retry 2 --retry-delay 15 \
            -X POST -H "Authorization: Bearer $CRON_SECRET" \
            "$API_BASE_URL/api/v1/internal/jobs/send-emails"
      - name: Run retry-webhooks
        # Stripe events whose processing failed or never finished (FR-WH-07)
        if: ${{ always() }}
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 120 --retry 2 --retry-delay 15 \
            -X POST -H "Authorization: Bearer $CRON_SECRET" \
            "$API_BASE_URL/api/v1/internal/jobs/retry-webhooks"

      - name: Run report-usage
        # Billable usage → Stripe's meter; Stripe accepts it until about an hour after a period ends
        if: ${{ always() }}
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 280 --retry 2 --retry-delay 15 \
            -X POST -H "Authorization: Bearer $CRON_SECRET" \
            "$API_BASE_URL/api/v1/internal/jobs/report-usage"

      - name: Run usage-rollup
        # Daily usage totals for the charts (last three days, recomputed)
        if: ${{ always() }}
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 120 --retry 2 --retry-delay 15 \
            -X POST -H "Authorization: Bearer $CRON_SECRET" \
            "$API_BASE_URL/api/v1/internal/jobs/usage-rollup"

  daily:
    name: reconcile, cleanup, usage checks, MRR, demo
    # Daily schedule, or a manual run
    if: >-
      ${{ vars.API_BASE_URL != '' &&
          (github.event_name == 'workflow_dispatch' || github.event.schedule == '15 3 * * *') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Run reconcile-stripe
        # Compares every subscription with Stripe and fixes drift (FR-WH-09)
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 280 --retry 1 --retry-delay 30 \
            -X POST -H "Authorization: Bearer $CRON_SECRET" \
            "$API_BASE_URL/api/v1/internal/jobs/reconcile-stripe"
      - name: Run cleanup
        if: ${{ always() }}
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 120 --retry 2 --retry-delay 15 \
            -X POST -H "Authorization: Bearer $CRON_SECRET" \
            "$API_BASE_URL/api/v1/internal/jobs/cleanup"

      - name: Run roll-free-periods
        # Free subscriptions whose month has ended → current month
        if: ${{ always() }}
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 120 --retry 2 --retry-delay 15 \
            -X POST -H "Authorization: Bearer $CRON_SECRET" \
            "$API_BASE_URL/api/v1/internal/jobs/roll-free-periods"

      - name: Run verify-usage-counters
        # usage_counters must equal the sum of their events; repaired and audited if not
        if: ${{ always() }}
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 120 --retry 2 --retry-delay 15 \
            -X POST -H "Authorization: Bearer $CRON_SECRET" \
            "$API_BASE_URL/api/v1/internal/jobs/verify-usage-counters"

      - name: Run mrr-snapshot
        # Today's MRR per organization, for the admin revenue charts (FR-AN-02)
        if: ${{ always() }}
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 120 --retry 2 --retry-delay 15 \
            -X POST -H "Authorization: Bearer $CRON_SECRET" \
            "$API_BASE_URL/api/v1/internal/jobs/mrr-snapshot"

      - name: Run reset-demo
        # Recreates the demo organizations (does nothing unless DEMO_ENABLED=true on the API)
        if: ${{ always() }}
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 280 --retry 1 --retry-delay 30 \
            -X POST -H "Authorization: Bearer $CRON_SECRET" \
            "$API_BASE_URL/api/v1/internal/jobs/reset-demo"
