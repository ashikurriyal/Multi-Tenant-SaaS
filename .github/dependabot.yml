version: 2
updates:
  - package-ecosystem: npm
    directory: /server
    schedule: { interval: weekly }
    target-branch: development
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Major upgrades (e.g. Prisma 8, Express 6) are done deliberately, not by bot
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: npm
    directory: /client
    schedule: { interval: weekly }
    target-branch: development
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    target-branch: development
